aid: polymateria
name: Polymateria
description: 'Polymateria Ltd is a British materials-science company, based at the Imperial
  College I-HUB on the White City Campus in London, that develops Biotransformation — a
  masterbatch additive blended into polyethylene and polypropylene at roughly 2% by weight so
  that plastic which escapes a waste stream weathers into a bioavailable wax and fully
  biodegrades in the open environment without leaving microplastics behind. The company
  co-authored BSI PAS 9017, the first standard for measuring the biodegradability of
  polyolefins, is a World Economic Forum Technology Pioneer and a Terra Carta signatory, and
  sells to converters, brand owners and packaging manufacturers rather than to developers. Its
  product is a chemical additive, not software: the public website is a WordPress marketing and
  media site, and the only credentialed surface it operates is a customer portal that serves
  third-party test datasets as documents. No developer program, public API, SDK or
  machine-readable API contract of any kind was found in this pass.'
